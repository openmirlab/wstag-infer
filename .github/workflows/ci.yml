name: Verify inference package

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU model dependencies and test tools
        run: |
          case '${{ matrix.python-version }}' in
            3.14|3.15) torch_version=2.15.0; torchaudio_version=2.11.1 ;;
            *) torch_version=2.7.1; torchaudio_version=2.7.1 ;;
          esac
          python -m pip install "torch==$torch_version" "torchaudio==$torchaudio_version" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[model,dev]'
      - name: Offline contract tests and lint
        run: |
          python -m pytest -q -m 'not model'
          python -m ruff check src tests

  installed-wheel:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel from source distribution
        run: |
          python -m pip install 'build>=1.3'
          python -m build
      - name: Install in a clean virtual environment and inspect public API
        run: |
          python -m venv "$RUNNER_TEMP/installed-wheel"
          "$RUNNER_TEMP/installed-wheel/bin/python" -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/installed-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed-wheel/bin/python" -I -c 'from wstag_infer import WSTAGSession, default_checkpoint; assert WSTAGSession(device="cpu", local_files_only=True).status == "unloaded"; assert len(default_checkpoint().files) == 3'
